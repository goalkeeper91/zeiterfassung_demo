# In-Container-Config: liefert nur die gebaute SPA statisch aus. HTTPS,
# Domain-Routing und Zugriffsschutz übernimmt der bereits laufende
# Shared-Reverse-Proxy des Zielservers (siehe DEPLOYMENT.md) - dieser
# Container hängt sich dort nur per Docker-Netzwerk per Servicename ein.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
